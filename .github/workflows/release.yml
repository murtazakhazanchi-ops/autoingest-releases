name: Build and Release AutoIngest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build purpose'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - rc
      rc_version:
        description: 'RC version, shaped X.Y.Z-rc.N (e.g. 0.9.12-rc.1) — required when build_type is rc'
        required: false
        type: string
      allow_unsigned_mac:
        description: 'D3 TEMPORARY EXCEPTION — publish this RC''s macOS build UNSIGNED because Apple Developer credentials are not yet provisioned. Never the default; must be explicitly set true per-run. Has no effect on the Stable (build-mac) path, which always requires real signing — see rc-build-mac''s "Determine macOS signing mode" step.'
        required: false
        default: false
        type: boolean

jobs:

  # ── Stable release path — triggered only by a v* tag push. ──────────────────
  # Publishes a real, public, non-draft, non-prerelease release for both
  # platforms. Guarded with `if: github.event_name == 'push'` only so that
  # workflow_dispatch can never accidentally reach this path. `build-mac`/
  # `build-windows` below are byte-for-byte unchanged by Part 9. `create-release`
  # gained exactly one line (`needs: stable-release-gate`) — architecture-
  # review finding: without this, the release gate existed but was never
  # actually invoked on the path that ships to real Stable users, so PM-002's
  # exact failure mode (a version/tag mismatch reaching a real release) was
  # still possible whenever a human forgot to run the gate manually. See
  # docs/product/features/AI-FEAT-057_MULTI_CHANNEL_RELEASE_UPDATE_SYSTEM.md.

  stable-release-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Extract override reason from the tag message (if present)
        # This event (push: tags: v*) has no workflow_dispatch UI to collect
        # an interactive --override-drift-check reason, so a legitimate
        # no-preceding-RC release (e.g. an emergency hotfix) needs a
        # git-native escape hatch instead: an annotated tag message
        # containing a line "Override-Drift-Check: <reason>" is honored
        # below. An operator's normal `git tag -a vX.Y.Z -m "AutoIngest
        # vX.Y.Z"` (this repo's existing convention) has no such line and
        # is correctly NOT treated as an override.
        #
        # The trailer is OPTIONAL, so "no matching line" must succeed with an
        # empty reason. GitHub runs this shell as `bash -e -o pipefail`, and
        # grep exits 1 when nothing matches, which would abort the job before
        # the gate ever ran (v0.9.12's first Stable tag hit exactly this). Only
        # grep's no-match status (1) is tolerated; a real grep error (2+) still
        # fails the step. An empty/whitespace-only trailer also yields an empty
        # reason, so it selects the normal gate and can never become an override.
        id: override
        shell: bash
        run: |
          MSG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          REASON=$(printf '%s\n' "$MSG" | { grep -m1 '^Override-Drift-Check:' || [ $? -eq 1 ]; } | sed 's/^Override-Drift-Check:[[:space:]]*//')
          {
            echo "reason<<EOF_OVERRIDE_REASON"
            echo "$REASON"
            echo "EOF_OVERRIDE_REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Release gate (Stable)
        # --auto-rc-commit discovers the matching "vX.Y.Z-rc.*" tag from git
        # history alone. A Stable release with no preceding RC tag AND no
        # Override-Drift-Check tag-message trailer correctly BLOCKS here
        # rather than publishing silently unverified — see `release gate
        # --help` and DEC-017 for the full reasoning.
        shell: bash
        env:
          OVERRIDE_REASON: ${{ steps.override.outputs.reason }}
        run: |
          if [ -n "$OVERRIDE_REASON" ]; then
            node scripts/product-docs/cli.js release gate --tag "${GITHUB_REF_NAME}" --channel stable --auto-rc-commit --override-drift-check "$OVERRIDE_REASON"
          else
            node scripts/product-docs/cli.js release gate --tag "${GITHUB_REF_NAME}" --channel stable --auto-rc-commit
          fi

  create-release:
    needs: stable-release-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  build-mac:
    needs: create-release
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create service account key
        shell: bash
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > config/service-account-key.json

      # D3 — macOS release signing/notarization. See scripts/verify-mac-signing.sh for the
      # verification-gate rationale. @electron/notarize's API-key route (electron-builder's
      # preferred/documented mechanism) expects APPLE_API_KEY to be a
      # FILE PATH to the downloaded AuthKey_XXXXXXXXXX.p8 — never its raw content — so the
      # raw key is held in its own secret (APPLE_API_KEY_P8) and written to a runner-local
      # temp file here, exactly like this workflow's existing SERVICE_ACCOUNT_KEY pattern.
      # The `secrets` context cannot be used in a step-level `if:` (GitHub Actions rejects
      # the whole workflow file at parse time if it is — caught live when dispatching this
      # workflow) — so the presence check moves inside the script instead; the step always
      # runs and is a fast no-op when the secret is empty.
      - name: Prepare Apple API key file (if configured)
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/apple-notarization-key.p8"
            echo "$APPLE_API_KEY_P8" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      # Presence-only preflight — never echoes a secret value. electron-builder's own
      # default behavior, confirmed from the installed app-builder-lib@26.8.1 source, is to
      # WARN and silently fall back to ad-hoc signing (or skip notarization entirely) when
      # credentials are missing, not to fail — so a real gate must exist above that default.
      - name: Verify macOS signing/notarization credentials are configured
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -z "${CSC_LINK:-}" ] && missing+=("CSC_LINK")
          [ -z "${CSC_KEY_PASSWORD:-}" ] && missing+=("CSC_KEY_PASSWORD")
          has_api_key=1
          [ -z "${APPLE_API_KEY:-}" ] && has_api_key=0
          [ -z "${APPLE_API_KEY_ID:-}" ] && has_api_key=0
          [ -z "${APPLE_API_ISSUER:-}" ] && has_api_key=0
          has_apple_id=1
          [ -z "${APPLE_ID:-}" ] && has_apple_id=0
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && has_apple_id=0
          [ -z "${APPLE_TEAM_ID:-}" ] && has_apple_id=0
          if [ "$has_api_key" -eq 0 ] && [ "$has_apple_id" -eq 0 ]; then
            missing+=("a complete notarization credential set: either (APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER) or (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::macOS release signing credentials are not configured. Missing: ${missing[*]}"
            exit 1
          fi
          echo "macOS signing/notarization credentials are present (values not shown)."

      - name: Build and publish Mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # -c.mac.forceCodeSigning=true is a release-build-only override (kept out of
        # package.json's static config) so `npm run dist:mac`/`build:mac` still packages
        # normally for a local developer with no Apple credentials — only the CI release
        # jobs must refuse to silently ship an ad-hoc/unsigned artifact.
        run: npm run dist:mac -- -p always -c.mac.forceCodeSigning=true

      # Independently verifies what electron-builder actually produced — never trusts a
      # clean exit code alone. Runs against BOTH architectures' raw appOutDir bundle
      # (before dmg/zip wrapping, catching a failure at the earliest point) plus the final
      # DMG containers. Fails the job — never uploads/publishes a silently-unsigned artifact.
      - name: Verify macOS release signing & notarization
        shell: bash
        run: |
          set -e
          bash scripts/verify-mac-signing.sh "dist/mac/AutoIngest.app"
          bash scripts/verify-mac-signing.sh "dist/mac-arm64/AutoIngest.app"
          for dmg in dist/AutoIngest-*.dmg; do
            echo "=== DMG: $dmg ==="
            codesign -dv --verbose=4 "$dmg" 2>&1 | tee /tmp/dmg-codesign.log
            grep -q "Signature=adhoc" /tmp/dmg-codesign.log && { echo "::error::$dmg is ad-hoc signed"; exit 1; }
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

  build-windows:
    needs: create-release
    if: github.event_name == 'push'
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create service account key
        shell: bash
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > config/service-account-key.json

      - name: Build and publish Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:win -- -p always

  # ── Development Build (additive, manual only) ────────────────────────────────
  # Renamed from "windows-tester-build" (Part 9) — behavior is otherwise
  # completely unchanged from the job that shipped during the BUG-011
  # investigation. Manually triggered via workflow_dispatch (build_type:
  # development) for internal engineering/testing. Builds Windows only, using
  # the same electron-builder config as the stable path above, but with
  # publish explicitly disabled (`-p never` overrides package.json's
  # build.publish regardless) — no tag, no GitHub Release, no update-channel
  # visibility whatsoever. Output is a short-retention Actions artifact only.
  # Select the branch/commit to build via GitHub's normal "Run workflow from
  # branch" control — this workflow does not accept an arbitrary ref as an
  # input.
  #
  # Deliberately does NOT create the telemetry service-account key secret the
  # stable jobs above use (services/telemetry.js is designed to no-op silently
  # without it — "Until credentials are configured the queue drains silently
  # — no crashes") — this keeps a real credential with write access to an
  # internal tracker sheet out of a short-retention artifact-only build.
  # Windows builds are unsigned in the stable path too (no certificateFile /
  # forceCodeSigning in package.json's build.win config), so this build's
  # signing posture matches the real stable build exactly.

  development-build:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'development'
    runs-on: windows-2022
    timeout-minutes: 30
    concurrency:
      group: development-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (no publish)
        run: npm run dist:win -- -p never

      - name: Get short commit SHA
        id: sha
        shell: bash
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write BUILD_INFO.txt
        shell: bash
        # Context values are passed through env: rather than interpolated directly
        # into the script (GitHub Actions script-injection hardening) — a workflow_dispatch
        # ref name is not free text an attacker fully controls, but never splice
        # github.* values straight into a run: block regardless.
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "Branch: $BUILD_BRANCH"
            echo "Commit SHA: $BUILD_COMMIT_SHA"
            echo "Build timestamp (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Package version: $(node -p "require('./package.json').version")"
            echo "Purpose: internal engineering/testing (Development channel)"
          } > dist/BUILD_INFO.txt

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoIngest-Development-${{ steps.sha.outputs.short_sha }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/BUILD_INFO.txt
          retention-days: 14
          if-no-files-found: error

  # ── RC / Preview Build (Part 9, additive, manual only) ───────────────────────
  # Manually triggered via workflow_dispatch (build_type: rc, rc_version: e.g.
  # "0.9.12-rc.1") — real tester acceptance before Stable, isolated from it at
  # every layer:
  #   - separate GitHub Release, always prerelease:true (electron-publish's
  #     GitHubPublisher only sets this from build.publish.releaseType, which
  #     this job overrides per-invocation via -c.publish.releaseType=prerelease
  #     — package.json's own static "release" default is untouched for Stable)
  #   - separate update-channel feed files, rc.yml / rc-mac.yml, via
  #     -c.publish.channel=rc (electron-builder's getUpdateInfoFileName is
  #     "${channel}${platformSuffix}.yml" — verified from
  #     app-builder-lib/out/publish/updateInfoBuilder.js — this NEVER writes
  #     latest.yml/latest-mac.yml, so Stable's own feed is untouched)
  #   - a Stable client (allowPrerelease=false, the default for any plain
  #     "X.Y.Z" installed version) resolves updates via GitHub's
  #     GET /releases/latest, which by definition excludes every
  #     prerelease-flagged release (verified from electron-updater/out/
  #     providers/GitHubProvider.js's getLatestTagName()) — a Stable client
  #     cannot discover an RC release through the normal update-check path
  #     regardless of any channel string. Only a Preview-opted-in client
  #     (allowPrerelease=true, autoUpdater.channel='rc') will ever see it.
  #
  # The RC tag is created and pushed by THIS workflow (rc-tag job, below) —
  # never left to electron-builder's own auto-create-release path, which
  # omits target_commitish and would attach a newly-created tag to the
  # repository's default branch rather than the exact commit this workflow
  # ran against (verified from electron-publish/out/gitHubPublisher.js's
  # createRelease()). Creating the real git tag first guarantees the release
  # is pinned to the exact reviewed commit.
  #
  # package.json's version is bumped to rc_version in the build environment
  # ONLY — never committed. The pushed git tag names which SOURCE commit this
  # RC build is, not a claim that commit's own checked-in package.json
  # already reads that version (see the "Stable rebuilds from the exact
  # verified RC source, only the version string differs" promotion model in
  # AI-FEAT-057 / DEC-017).

  rc-tag:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'rc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rc_tag: ${{ steps.compute.outputs.rc_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate rc_version and compute tag
        id: compute
        env:
          RC_VERSION: ${{ github.event.inputs.rc_version }}
        run: |
          if [[ ! "$RC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::rc_version must be shaped X.Y.Z-rc.N (e.g. 0.9.12-rc.1), got: '$RC_VERSION'"
            exit 1
          fi
          echo "rc_tag=v$RC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push RC tag
        env:
          RC_TAG: v${{ github.event.inputs.rc_version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RC_TAG" >/dev/null; then
            echo "::error::Tag $RC_TAG already exists — choose a new RC number rather than reusing one (see PM-002's rollback runbook for the manual re-tag procedure if this RC genuinely needs to be replaced)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RC_TAG" -m "AutoIngest RC $RC_TAG (commit $(git rev-parse HEAD))"
          git push origin "$RC_TAG"

  rc-build-windows:
    needs: rc-tag
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.rc-tag.outputs.rc_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create service account key
        shell: bash
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > config/service-account-key.json

      - name: Set ephemeral RC version (not committed)
        shell: bash
        env:
          RC_VERSION: ${{ github.event.inputs.rc_version }}
        run: npm version "$RC_VERSION" --no-git-tag-version --allow-same-version

      - name: Release gate (RC)
        shell: bash
        env:
          RC_TAG: ${{ needs.rc-tag.outputs.rc_tag }}
        run: node scripts/product-docs/cli.js release gate --tag "$RC_TAG" --channel rc

      - name: Build and publish Windows RC
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:win -- -p always -c.publish.channel=rc -c.publish.releaseType=prerelease

  rc-build-mac:
    needs: rc-tag
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.rc-tag.outputs.rc_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create service account key
        shell: bash
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > config/service-account-key.json

      - name: Set ephemeral RC version (not committed)
        env:
          RC_VERSION: ${{ github.event.inputs.rc_version }}
        run: npm version "$RC_VERSION" --no-git-tag-version --allow-same-version

      - name: Release gate (RC)
        env:
          RC_TAG: ${{ needs.rc-tag.outputs.rc_tag }}
        run: node scripts/product-docs/cli.js release gate --tag "$RC_TAG" --channel rc

      # D3 — macOS release signing/notarization. Identical mechanism/rationale as build-mac
      # (kept in sync — see that job's comments). RC and Stable must never diverge here
      # EXCEPT for the one explicit, temporary exception below: while D3's Apple Developer
      # credentials remain unprovisioned, a human can pass allow_unsigned_mac=true on this
      # workflow_dispatch run to publish this RC's macOS build unsigned rather than block
      # the whole RC on signing. This bypass has no effect on build-mac (Stable), which has
      # no such input and always requires real signing — deliberately: Stable is not the
      # temporary-exception path. Never triggered by secret absence alone; only by this
      # explicit per-run operator choice.
      - name: Determine macOS signing mode
        id: mac_signing_mode
        shell: bash
        env:
          ALLOW_UNSIGNED_MAC: ${{ github.event.inputs.allow_unsigned_mac }}
        run: |
          if [ "$ALLOW_UNSIGNED_MAC" = "true" ]; then
            echo "::warning::D3 UNSIGNED macOS EXCEPTION explicitly authorized for this run (allow_unsigned_mac=true). This RC's macOS build will be published UNSIGNED / NOT NOTARIZED. This is a deliberate, temporary, per-run exception because Apple Developer credentials are not yet provisioned (D3 deferred) — never a silent fallback from missing secrets. The signed path remains the default and will be enforced again once credentials exist."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          else
            echo "macOS signing mode: signed (default — pass allow_unsigned_mac=true explicitly to bypass, only while D3 credentials remain unprovisioned)."
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          fi

      # See build-mac's identical step for why this has no step-level `if:`.
      - name: Prepare Apple API key file (if configured)
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/apple-notarization-key.p8"
            echo "$APPLE_API_KEY_P8" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Verify macOS signing/notarization credentials are configured
        if: steps.mac_signing_mode.outputs.mode == 'signed'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -z "${CSC_LINK:-}" ] && missing+=("CSC_LINK")
          [ -z "${CSC_KEY_PASSWORD:-}" ] && missing+=("CSC_KEY_PASSWORD")
          has_api_key=1
          [ -z "${APPLE_API_KEY:-}" ] && has_api_key=0
          [ -z "${APPLE_API_KEY_ID:-}" ] && has_api_key=0
          [ -z "${APPLE_API_ISSUER:-}" ] && has_api_key=0
          has_apple_id=1
          [ -z "${APPLE_ID:-}" ] && has_apple_id=0
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && has_apple_id=0
          [ -z "${APPLE_TEAM_ID:-}" ] && has_apple_id=0
          if [ "$has_api_key" -eq 0 ] && [ "$has_apple_id" -eq 0 ]; then
            missing+=("a complete notarization credential set: either (APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER) or (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::macOS release signing credentials are not configured. Missing: ${missing[*]}"
            exit 1
          fi
          echo "macOS signing/notarization credentials are present (values not shown)."

      - name: Build and publish Mac RC
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_SIGNING_MODE: ${{ steps.mac_signing_mode.outputs.mode }}
        run: |
          if [ "$MAC_SIGNING_MODE" = "unsigned" ]; then
            echo "::warning::Building macOS RC with forceCodeSigning=false — D3 unsigned exception active."
            # A GitHub secret that does not exist evaluates to an EMPTY STRING in ${{ }},
            # never "unset" — and electron-builder's own credential resolution (confirmed
            # live: real CI failure "/…/autoingest-releases not a file") treats an empty
            # CSC_LINK as a real (if malformed) certificate path rather than "absent",
            # trying to import the working directory itself. Truly unsetting these here
            # (not just leaving them empty) is what actually reproduces the normal,
            # already-correct "no credentials configured" skip/ad-hoc-fallback path.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run dist:mac -- -p always -c.publish.channel=rc -c.publish.releaseType=prerelease -c.mac.forceCodeSigning=false
          else
            npm run dist:mac -- -p always -c.publish.channel=rc -c.publish.releaseType=prerelease -c.mac.forceCodeSigning=true
          fi

      - name: Verify macOS release signing & notarization
        if: steps.mac_signing_mode.outputs.mode == 'signed'
        shell: bash
        run: |
          set -e
          bash scripts/verify-mac-signing.sh "dist/mac/AutoIngest.app"
          bash scripts/verify-mac-signing.sh "dist/mac-arm64/AutoIngest.app"
          for dmg in dist/AutoIngest-*.dmg; do
            echo "=== DMG: $dmg ==="
            codesign -dv --verbose=4 "$dmg" 2>&1 | tee /tmp/dmg-codesign.log
            grep -q "Signature=adhoc" /tmp/dmg-codesign.log && { echo "::error::$dmg is ad-hoc signed"; exit 1; }
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      # The unsigned-exception path deliberately does NOT run verify-mac-signing.sh's strict
      # pass/fail gate — that gate is designed to correctly FAIL an unsigned build, and Phase
      # 6 of this authorization explicitly forbids "running signed verification gates and
      # ignoring failures." Instead: confirm the artifacts actually exist (a real build
      # happened, not a silently-empty one) and log non-fatal diagnostics for the record.
      - name: Confirm unsigned macOS artifacts (D3 deferred — no strict signing gate run)
        if: steps.mac_signing_mode.outputs.mode == 'unsigned'
        shell: bash
        run: |
          set -e
          for app in dist/mac/AutoIngest.app dist/mac-arm64/AutoIngest.app; do
            if [ ! -d "$app" ]; then
              echo "::error::expected app bundle missing: $app"
              exit 1
            fi
            echo "=== $app (diagnostic only — not a pass/fail gate) ==="
            codesign -dv --verbose=4 "$app" 2>&1 || true
          done
          echo "::warning::UNSIGNED / NOT NOTARIZED — D3 DEFERRED. This macOS build was explicitly published unsigned because Apple Developer credentials are not yet provisioned. Gatekeeper will reject it; a manual Privacy & Security -> Open Anyway (or equivalent) approval is required to run it after download. This is an accepted, temporary, per-run exception authorized via allow_unsigned_mac=true — not a silent fallback and not a claim that signing succeeded."
