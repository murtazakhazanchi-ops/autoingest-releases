<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>AutoIngest</title>
  <script src="../theme-init.js"></script>
  <link rel="stylesheet" href="companion.css">
</head>
<body>
  <!-- EQI-1.1: one popup, two presentations — data-view="compact" (card overview) or "expanded"
       (Event Dump for one card). main.js sizes the window to match; every value shown comes from
       main's snapshot. -->
  <main class="popup" data-view="compact" aria-labelledby="popup-title">
    <header class="popup-header">
      <!-- The official AutoIngest app icon (64 px rendition from assets/mac.icns), shown at 32 px. -->
      <img class="brand-mark" src="app-icon.png" width="32" height="32" alt="" aria-hidden="true">
      <div class="brand-text">
        <h1 id="popup-title">AutoIngest</h1>
        <p class="brand-sub" id="brand-sub">Card companion</p>
      </div>
    </header>

    <!-- ── Compact: card overview ───────────────────────────────────────────── -->
    <section class="status view-compact" aria-live="polite" aria-labelledby="status-heading">
      <h2 id="status-heading" class="status-heading">Checking for cards…</h2>

      <div id="empty-state" class="empty" hidden>
        <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 3h7.5L19 7.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
          <path d="M10 3v4M13 3v4"/>
        </svg>
        <p>Insert a memory card to see it here.</p>
      </div>

      <ul id="card-list" class="card-list scroll-area" hidden></ul>
    </section>

    <!-- ── Expanded: Event Dump for one card ─────────────────────────────────── -->
    <section class="xp view-expanded" id="xp" hidden aria-label="Event Dump">
      <div class="xp-body scroll-area">
        <section class="xp-section xp-card" aria-label="Card">
          <div class="xp-card-head">
            <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M7 3h7.5L19 7.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
              <path d="M10 3v4M13 3v4"/>
            </svg>
            <div class="card-text">
              <span class="xp-card-label" id="xp-card-label"></span>
              <span class="xp-card-meta" id="xp-card-meta"></span>
            </div>
          </div>
          <div class="xp-grid">
            <label class="field">
              <span class="field-label">Shoot date</span>
              <select id="xp-date"></select>
            </label>
            <div class="xp-counts">
              <p class="xp-counts-main" id="xp-counts"></p>
              <p class="xp-counts-sub" id="xp-counts-sub"></p>
            </div>
          </div>
          <label class="dump-earlier-row" id="xp-earlier-row" hidden>
            <input type="checkbox" id="xp-earlier">
            <span id="xp-earlier-text"></span>
          </label>
        </section>

        <section class="xp-section" aria-labelledby="xp-event-title">
          <h3 class="xp-title" id="xp-event-title">Selected Event</h3>
          <p class="xp-event-coll" id="xp-event-coll"></p>
          <p class="xp-event-name" id="xp-event-name"></p>
          <div class="xp-event-actions">
            <button type="button" class="btn btn-secondary" id="xp-change-event">Change Event</button>
            <button type="button" class="btn btn-secondary" id="xp-new-event">Create New Event</button>
          </div>
          <!-- One-click event picker (companion-owned; the Event Creator's own event scan). -->
          <div class="picker" id="xp-picker" hidden>
            <input type="search" id="xp-picker-search" class="text-input" placeholder="Search events" aria-label="Search events" autocomplete="off" spellcheck="false">
            <ul class="picker-list scroll-area" id="xp-picker-list" role="listbox" aria-label="Events"></ul>
            <p class="picker-note" id="xp-picker-note" hidden></p>
            <div class="picker-actions">
              <button type="button" class="btn btn-quiet" id="xp-picker-cancel">Cancel</button>
              <button type="button" class="btn btn-primary" id="xp-picker-use" disabled>Use This Event</button>
            </div>
          </div>
        </section>

        <section class="xp-section" aria-labelledby="xp-ph-title">
          <h3 class="xp-title" id="xp-ph-title">Photographer</h3>
          <div class="combo" id="xp-combo">
            <input type="text" id="xp-ph-input" class="text-input" role="combobox" aria-expanded="false" aria-controls="xp-ph-list"
                   aria-autocomplete="list" placeholder="Type to search photographers" autocomplete="off" spellcheck="false">
            <ul class="combo-list scroll-area" id="xp-ph-list" role="listbox" hidden></ul>
          </div>
          <p class="xp-ph-state" id="xp-ph-state"></p>
          <p class="dump-suggest" id="xp-ph-suggest" hidden>Last used: <button type="button" class="link-btn" id="xp-ph-use-last"></button></p>
        </section>

        <section class="xp-section" aria-labelledby="xp-dest-title">
          <h3 class="xp-title" id="xp-dest-title">Destination</h3>
          <p class="xp-dest" id="xp-dest"></p>
        </section>
      </div>

      <!-- Pinned: the import action and its progress stay reachable while the content scrolls. -->
      <div class="xp-action">
        <div class="dump-progress" id="xp-progress" role="status" hidden>
          <span id="xp-progress-text"></span>
          <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="xp-bar"></div></div>
        </div>
        <p class="dump-result" id="xp-result" role="status" aria-live="polite" hidden></p>
        <button type="button" class="btn btn-primary xp-import" id="xp-import">Import to Dump</button>
      </div>
    </section>

    <footer class="actions">
      <button type="button" id="back-btn" class="btn btn-secondary view-expanded" hidden>← Card Overview</button>
      <button type="button" id="open-btn" class="btn btn-primary">Open AutoIngest</button>
      <button type="button" id="quit-btn" class="btn btn-quiet view-compact">Quit AutoIngest</button>
    </footer>
  </main>

  <template id="card-row">
    <li class="card-row">
      <div class="card-head">
        <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 3h7.5L19 7.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
          <path d="M10 3v4M13 3v4"/>
        </svg>
        <div class="card-text">
          <span class="card-label"></span>
          <span class="card-meta"><span class="status-dot" aria-hidden="true"></span><span class="card-status">Detected</span> · Memory card<span class="card-disambiguator"></span></span>
        </div>
      </div>

      <!-- Q3: cameras found on this card — names and counts only, never serial numbers. -->
      <div class="cameras" hidden>
        <p class="cameras-heading">Cameras</p>
        <ul class="camera-list"></ul>
        <button type="button" class="link-btn cameras-more" hidden></button>
      </div>

      <!-- Q2: capture-date assessment. Every value below comes from main's snapshot. -->
      <div class="assessment">
        <!-- Review handoff outcome first, so a refusal is visible without scrolling. -->
        <p class="assess-notice" role="status" aria-live="polite" hidden></p>
        <div class="assess-progress" role="status">
          <span class="progress-text"></span>
          <div class="progress-track" aria-hidden="true"><div class="progress-bar"></div></div>
        </div>
        <p class="assess-error" role="alert" hidden></p>

        <div class="assess-result" hidden>
          <label class="field">
            <span class="field-label">Shoot date</span>
            <select class="date-select"></select>
          </label>

          <p class="selected-line"><strong class="selected-num"></strong> <span class="selected-caption"></span></p>
          <p class="selected-breakdown"></p>
          <!-- EQI-1.1: import status at a glance (file-level history). -->
          <p class="import-status"></p>

          <dl class="buckets">
            <div class="bucket"><dt>Earlier</dt><dd class="earlier-count"></dd></div>
            <div class="bucket later-bucket"><dt>Later</dt><dd class="later-count"></dd></div>
            <div class="bucket"><dt>Date uncertain</dt><dd class="uncertain-count"></dd></div>
          </dl>

          <div class="card-actions">
            <button type="button" class="btn btn-secondary review-selected">Review Selected Date</button>
            <button type="button" class="btn btn-secondary review-earlier">Review Earlier Files</button>
          </div>
          <button type="button" class="btn btn-primary event-dump-btn">Event Dump</button>
          <p class="dump-last" hidden></p>

          <p class="suggestion" hidden><span class="suggestion-text"></span> <button type="button" class="link-btn use-suggestion"></button></p>
          <p class="assess-note" hidden></p>

          <label class="field field-inline">
            <span class="field-label">Continues after midnight</span>
            <select class="midnight-select"></select>
          </label>
        </div>
      </div>
    </li>
  </template>

  <script src="photographerMatch.js"></script>
  <script src="companion.js"></script>
</body>
</html>
